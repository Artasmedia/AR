<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Postcard AR</title>
<!-- ============================================================
     POSTCARD AR — v7 (drag to spin and tilt, still anchored)
     Target: Burton Agnes drum photo (./targets.mind)
     Model:  ./burton-agnes-drum.glb

     To change the postcard:
     1. Compile the card image at:
        https://hiukim.github.io/mind-ar-js-doc/tools/compile
     2. Upload the resulting targets.mind to this repo
     3. In the a-scene tag below, change imageTargetSrc
     4. Upload your .glb to the repo and change the a-asset-item src
     5. Tune the scale on the a-gltf-model line
     ============================================================ -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<script>
  /* Drag anywhere on screen: left/right spins the model, up/down
     tilts it (clamped so it can't flip upside down). Tracking (the
     anchor) and finger rotation (the model) live on different
     entities, so they never fight. */
  AFRAME.registerComponent("touch-spin", {
    init() {
      const obj = this.el.object3D;
      let lastX = null, lastY = null;

      const start = (x, y) => { lastX = x; lastY = y; };
      const move = (x, y) => {
        if (lastX === null) return;
        obj.rotation.y += (x - lastX) * 0.01; // spin — sensitivity: radians per pixel
        obj.rotation.x += (y - lastY) * 0.01; // tilt
        // clamp tilt to about ±70° so it never flips over the poles
        obj.rotation.x = Math.max(-1.2, Math.min(1.2, obj.rotation.x));
        lastX = x; lastY = y;
      };
      const end = () => { lastX = null; lastY = null; };

      // Touch (phone)
      window.addEventListener("touchstart", (e) => start(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
      window.addEventListener("touchmove",  (e) => move(e.touches[0].clientX, e.touches[0].clientY),  { passive: true });
      window.addEventListener("touchend", end);

      // Mouse (desktop testing)
      window.addEventListener("mousedown", (e) => start(e.clientX, e.clientY));
      window.addEventListener("mousemove", (e) => { if (e.buttons) move(e.clientX, e.clientY); });
      window.addEventListener("mouseup", end);
    }
  });
</script>

<style>
  /* Deliberately minimal — no backgrounds, nothing that can
     paint over the camera feed. */
  html, body { margin: 0; padding: 0; }
  #version {
    position: fixed;
    top: max(8px, env(safe-area-inset-top));
    right: 8px;
    z-index: 1000;
    font-family: monospace;
    font-size: 11px;
    color: #fff;
    background: rgba(0,0,0,0.45);
    padding: 3px 7px;
    border-radius: 4px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="version">v7</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.01;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">
  <a-assets>
    <a-asset-item id="model"
      src="./burton-agnes-drum.glb">
    </a-asset-item>
  </a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="anchor" mindar-image-target="targetIndex: 0">
    <!-- Outer wrapper: placement on the card (position) and the
         tip-towards-camera (rotation 90). The model inside spins
         about its own upright axis via touch-spin, so dragging
         never disturbs the placement. Card is 1 unit wide. -->
    <a-entity position="0 0 0.3" rotation="90 0 0">
      <a-gltf-model
        id="drum"
        src="#model"
        rotation="0 0 0"
        scale="0.005 0.005 0.005"
        touch-spin>
      </a-gltf-model>
    </a-entity>
  </a-entity>
</a-scene>

<script>
  // MindAR locks camera dimensions at startup and doesn't survive
  // orientation changes — restart cleanly when the phone rotates.
  // (Libraries are cached, so the reload is quick.)
  let lastPortrait = window.matchMedia("(orientation: portrait)").matches;
  window.matchMedia("(orientation: portrait)").addEventListener("change", (e) => {
    if (e.matches !== lastPortrait) {
      lastPortrait = e.matches;
      setTimeout(() => location.reload(), 300);
    }
  });
</script>
</body>
</html>
