<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Postcard AR</title>
<!-- ============================================================
     POSTCARD AR — v6 (drag to rotate the model, still anchored)
     Target: Burton Agnes drum photo (./targets.mind)
     Model:  ./burton-agnes-drum.glb

     To change the postcard:
     1. Compile the card image at:
        https://hiukim.github.io/mind-ar-js-doc/tools/compile
     2. Upload the resulting targets.mind to this repo
     3. In the a-scene tag below, change imageTargetSrc
     4. Upload your .glb to the repo and change the a-asset-item src
     5. Tune the scale on the a-gltf-model line
     ============================================================ -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<script>
  /* Drag left/right anywhere on screen to spin the model on its own
     axis. Tracking (the anchor) and finger rotation (the model) live
     on different entities, so they never fight. */
  AFRAME.registerComponent("touch-spin", {
    init() {
      const obj = this.el.object3D;
      let lastX = null;

      const start = (x) => { lastX = x; };
      const move = (x) => {
        if (lastX === null) return;
        obj.rotation.y += (x - lastX) * 0.01; // sensitivity: radians per pixel
        lastX = x;
      };
      const end = () => { lastX = null; };

      // Touch (phone)
      window.addEventListener("touchstart", (e) => start(e.touches[0].clientX), { passive: true });
      window.addEventListener("touchmove",  (e) => move(e.touches[0].clientX),  { passive: true });
      window.addEventListener("touchend", end);

      // Mouse (desktop testing)
      window.addEventListener("mousedown", (e) => start(e.clientX));
      window.addEventListener("mousemove", (e) => { if (e.buttons) move(e.clientX); });
      window.addEventListener("mouseup", end);
    }
  });
</script>

<style>
  /* Deliberately minimal — no backgrounds, nothing that can
     paint over the camera feed. */
  html, body { margin: 0; padding: 0; }
  #version {
    position: fixed;
    top: max(8px, env(safe-area-inset-top));
    right: 8px;
    z-index: 1000;
    font-family: monospace;
    font-size: 11px;
    color: #fff;
    background: rgba(0,0,0,0.45);
    padding: 3px 7px;
    border-radius: 4px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="version">v6</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.01;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">
  <a-assets>
    <a-asset-item id="model"
      src="./burton-agnes-drum.glb">
    </a-asset-item>
  </a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="anchor" mindar-image-target="targetIndex: 0">
    <!-- Outer wrapper: placement on the card (position) and the
         tip-towards-camera (rotation 90). The model inside spins
         about its own upright axis via touch-spin, so dragging
         never disturbs the placement. Card is 1 unit wide. -->
    <a-entity position="0 0 0.3" rotation="90 0 0">
      <a-gltf-model
        id="drum"
        src="#model"
        rotation="0 0 0"
        scale="0.005 0.005 0.005"
        touch-spin>
      </a-gltf-model>
    </a-entity>
  </a-entity>
</a-scene>

<script>
  // MindAR locks camera dimensions at startup and doesn't survive
  // orientation changes — restart cleanly when the phone rotates.
  // (Libraries are cached, so the reload is quick.)
  let lastPortrait = window.matchMedia("(orientation: portrait)").matches;
  window.matchMedia("(orientation: portrait)").addEventListener("change", (e) => {
    if (e.matches !== lastPortrait) {
      lastPortrait = e.matches;
      setTimeout(() => location.reload(), 300);
    }
  });
</script>
</body>
</html>
