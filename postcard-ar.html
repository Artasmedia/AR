<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Postcard AR</title>

<!-- ============================================================
     POSTCARD AR — MindAR + A-Frame WebAR template
     ------------------------------------------------------------
     HOW TO USE:

     1. TEST IT FIRST (works out of the box):
        Serve this file over HTTPS or localhost, open it on your
        phone, and point the camera at the MindAR sample card:
        https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png
        (print it or just display it on a monitor)

     2. SWAP IN YOUR POSTCARD:
        a. Go to the MindAR image target compiler:
           https://hiukim.github.io/mind-ar-js-doc/tools/compile
        b. Upload a straight-on scan/render of the postcard front.
           Check the feature points preview — you want dense,
           well-spread dots. Sparse dots = poor tracking.
        c. Download targets.mind, put it next to this file,
           and set TARGET_FILE below to "./targets.mind".
        d. Set CONTENT_MODE and the video/model URLs.

     3. HOSTING:
        Camera access requires HTTPS (localhost is exempt).
        Quick local test:   npx serve .
        Quick public host:  GitHub Pages / Netlify / any static host.
        Then put the URL in a QR code on the back of the card.
     ============================================================ -->

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<script>
/* ================= CONFIG — edit this block ================= */

// Compiled image target (.mind file). Replace with "./targets.mind"
// once you've compiled your own postcard.
const TARGET_FILE =
  "https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind";

// "video"  = a video plane sits on top of the postcard (image comes alive)
// "model"  = a 3D model floats above the postcard
// "both"   = video on the card, model above it
const CONTENT_MODE = "model";

// Video overlay (used in "video" / "both" modes).
// Keep it short, muted-friendly, and H.264 MP4 for iOS Safari.
const VIDEO_URL =
  "https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/dance.mp4";

// Postcard aspect ratio (width / height) of YOUR printed card,
// so the video plane matches it. A6 landscape = 148/105.
const CARD_ASPECT = 148 / 105;

// GLB model (used in "model" / "both" modes).
// Swap in one of your digitised objects — keep it under ~5 MB,
// draco/meshopt compressed if possible.
const MODEL_URL =
  "https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf";

const MODEL_SCALE    = "0.05 0.05 0.05"; // tune per model
const MODEL_POSITION = "0 0.1 0";        // metres-ish above card centre
const MODEL_SPIN     = true;             // slow turntable rotation

// Optional call-to-action link shown once the target is found.
// Set to "" to hide the button entirely.
const CTA_URL   = "https://cloudtour.tv";
const CTA_LABEL = "Open the full tour";

/* ============================================================ */
</script>

<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* MindAR injects its own loading UI; hide it, we draw our own */
  .mindar-ui-overlay { display: none !important; }

  #overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: max(28px, env(safe-area-inset-bottom));
  }

  .pill {
    pointer-events: auto;
    background: rgba(15, 15, 18, 0.78);
    color: #f2f2f2;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 15px;
    letter-spacing: 0.01em;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    gap: 10px;
    transition: opacity 0.3s ease;
  }

  .pill .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ffb454;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .pill.found .dot { background: #6fe08b; animation: none; }

  @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pill .dot { animation: none; }
  }

  #cta {
    pointer-events: auto;
    margin-top: 12px;
    display: none;
    text-decoration: none;
    background: #f2f2f2;
    color: #111;
    font-weight: 600;
    font-size: 15px;
    border-radius: 999px;
    padding: 12px 22px;
  }
  #cta.visible { display: inline-block; }

  #loading {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: #0d0d10;
    color: #e8e8e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    transition: opacity 0.4s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }

  .spinner {
    width: 34px; height: 34px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: #f2f2f2;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2s; }
  }

  #loading small { color: #9a9a9a; font-size: 13px; }

  #error {
    display: none;
    max-width: 280px;
    text-align: center;
    font-size: 14px;
    line-height: 1.5;
    color: #f0c8c8;
  }
</style>
</head>

<body>

<div id="loading">
  <div class="spinner"></div>
  <div>Starting camera&hellip;</div>
  <small>Allow camera access when prompted</small>
  <div id="error"></div>
</div>

<div id="overlay">
  <div class="pill" id="status">
    <span class="dot"></span>
    <span id="status-text">Point your camera at the postcard</span>
  </div>
  <a id="cta" target="_blank" rel="noopener"></a>
</div>

<script>
/* Slow turntable rotation for the model */
AFRAME.registerComponent("spin", {
  tick(time, dt) {
    if (!MODEL_SPIN) return;
    this.el.object3D.rotation.y += (dt / 1000) * 0.6; // rad/s
  }
});

/* Build the scene from config */
document.addEventListener("DOMContentLoaded", () => {
  const scene = document.createElement("a-scene");
  scene.setAttribute("mindar-image",
    `imageTargetSrc: ${TARGET_FILE}; uiScanning: no; uiLoading: no; uiError: no;`);
  scene.setAttribute("color-space", "sRGB");
  scene.setAttribute("renderer", "colorManagement: true; physicallyCorrectLights: true");
  scene.setAttribute("vr-mode-ui", "enabled: false");
  scene.setAttribute("device-orientation-permission-ui", "enabled: false");
  scene.setAttribute("embedded", "");

  const assets = document.createElement("a-assets");

  const wantVideo = CONTENT_MODE === "video" || CONTENT_MODE === "both";
  const wantModel = CONTENT_MODE === "model" || CONTENT_MODE === "both";

  let videoEl = null;
  if (wantVideo) {
    videoEl = document.createElement("video");
    videoEl.id = "ar-video";
    videoEl.src = VIDEO_URL;
    videoEl.setAttribute("preload", "auto");
    videoEl.setAttribute("loop", "");
    videoEl.setAttribute("muted", "");
    videoEl.muted = true;                      // required for autoplay
    videoEl.setAttribute("playsinline", "");   // required on iOS
    videoEl.setAttribute("crossorigin", "anonymous");
    assets.appendChild(videoEl);
  }

  if (wantModel) {
    const modelAsset = document.createElement("a-asset-item");
    modelAsset.id = "ar-model";
    modelAsset.setAttribute("src", MODEL_URL);
    assets.appendChild(modelAsset);
  }

  scene.appendChild(assets);

  const camera = document.createElement("a-camera");
  camera.setAttribute("position", "0 0 0");
  camera.setAttribute("look-controls", "enabled: false");
  scene.appendChild(camera);

  const anchor = document.createElement("a-entity");
  anchor.setAttribute("mindar-image-target", "targetIndex: 0");

  if (wantVideo) {
    // Plane sized to the card: MindAR normalises target width to 1.
    const plane = document.createElement("a-video");
    plane.setAttribute("src", "#ar-video");
    plane.setAttribute("width", "1");
    plane.setAttribute("height", (1 / CARD_ASPECT).toFixed(4));
    plane.setAttribute("position", "0 0 0.001"); // just proud of the card
    plane.setAttribute("rotation", "0 0 0");
    anchor.appendChild(plane);
  }

  if (wantModel) {
    const model = document.createElement("a-gltf-model");
    model.setAttribute("src", "#ar-model");
    model.setAttribute("scale", MODEL_SCALE);
    model.setAttribute("position", MODEL_POSITION);
    model.setAttribute("spin", "");
    anchor.appendChild(model);
  }

  scene.appendChild(anchor);
  document.body.appendChild(scene);

  /* ---- UI wiring ---- */
  const loading    = document.getElementById("loading");
  const errorBox   = document.getElementById("error");
  const statusPill = document.getElementById("status");
  const statusText = document.getElementById("status-text");
  const cta        = document.getElementById("cta");

  if (CTA_URL) {
    cta.href = CTA_URL;
    cta.textContent = CTA_LABEL;
  }

  scene.addEventListener("arReady", () => loading.classList.add("hidden"));

  scene.addEventListener("arError", () => {
    document.querySelector(".spinner").style.display = "none";
    errorBox.style.display = "block";
    errorBox.textContent =
      "Couldn't start the camera. Check camera permission for this site, " +
      "and make sure you're on HTTPS.";
  });

  anchor.addEventListener("targetFound", () => {
    statusPill.classList.add("found");
    statusText.textContent = "Found it";
    if (CTA_URL) cta.classList.add("visible");
    if (videoEl) videoEl.play().catch(() => {});
  });

  anchor.addEventListener("targetLost", () => {
    statusPill.classList.remove("found");
    statusText.textContent = "Point your camera at the postcard";
    if (videoEl) videoEl.pause();
  });
});
</script>

</body>
</html>
